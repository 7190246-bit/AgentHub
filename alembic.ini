# Alembic 配置文件
# 用于数据库迁移

[alembic]
# 迁移脚本目录
script_location = alembic

# 迁移文件命名格式
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path 路径
prepend_sys_path = .

# 迁移环境
# timezone = UTC

# 数据库连接配置
sqlalchemy.url = postgresql://agenthub:agenthub_password@localhost:5432/agenthub

# 解释器配置
[post_write_hooks]
# 格式化代码
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
